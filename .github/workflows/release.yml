name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      # Optional: add these repo secrets to sign the release APK with a real key.
      # Without them, the release APK falls back to the debug key (still installable).
      #   RELEASE_KEYSTORE_B64   — base64 of your .jks/.keystore
      #   RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD
      - name: Decode release keystore
        if: env.RELEASE_KEYSTORE_B64 != ''
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > release.keystore
          echo "RELEASE_STORE_FILE=$(pwd)/release.keystore" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build debug + release APKs
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Nsz-debug.apk
          cp app/build/outputs/apk/release/app-release.apk Nsz-release.apk

      - name: Upload artifacts (every run)
        uses: actions/upload-artifact@v4
        with:
          name: Nsz-apks
          path: |
            Nsz-debug.apk
            Nsz-release.apk

      - name: Attach to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Nsz-debug.apk
            Nsz-release.apk
